name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native Windows app
        shell: pwsh
        run: |
          ./build.ps1
          ./test.ps1
      - name: Package stable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path './dist/RedeClara.exe')).FileVersion
          if ($env:RELEASE_TAG -ne ('v'+([version]$version).ToString(3))) { throw 'A versão da tag deve corresponder ao executável.' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release já publicado; arquivos existentes preservados.'; exit 0 }
          ./package.ps1 -SkipBuild
          gh release create $env:RELEASE_TAG ./dist/RedeClara.exe ./dist/RedeClara-win-x64.zip ./dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title ('Rede Clara '+$env:RELEASE_TAG) --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar o release.' }
